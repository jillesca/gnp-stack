apiVersion: 1

groups:
  - orgId: 1
    name: xrd-interface-alerts
    folder: XRd Alerting
    interval: 30s
    rules:
      # ── Primary: physical interface operationally DOWN ─────────────────────────
      - uid: xrd-interface-down
        title: XRd Interface Down
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'openconfig_interfaces_interface_state_oper_status{name!~"Loopback.*|MgmtEth.*"}'
              instant: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15s
        labels:
          severity: critical
          event_type: interface_state
          affected_object_type: interface
        annotations:
          description: "Interface {{ $labels.name }} on {{ $labels.source }} is DOWN"
          summary: "XRd Interface Down: {{ $labels.source }} - {{ $labels.name }}"
        isPaused: false

      # ── Secondary: ISIS adjacency in non-UP state (cascade indicator) ──────────
      - uid: xrd-isis-adjacency-down
        title: XRd ISIS Adjacency Down
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              # Count adjacency entries whose state is NOT the UP value ("isis-adj-1-state").
              # Falls back to 0 so NoData does not fire during normal operation.
              expr: 'count(Cisco_IOS_XR_clns_isis_oper_isis_instances_instance_neighbors_neighbor_neighbor_state{neighbor_state!="isis-adj-1-state"}) or vector(0)'
              instant: true
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 15s
        labels:
          severity: warning
          event_type: isis_adjacency
          protocol: isis
        annotations:
          description: "One or more ISIS adjacencies are in a non-UP state. Network convergence may be in progress."
          summary: "XRd ISIS Adjacency Down"
        isPaused: false
