<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .node-box {
        fill: #1a1a2e;
        stroke: #4a4a6a;
        stroke-width: 2;
        rx: 8;
        ry: 8;
      }

      .node-label {
        fill: #ffffff;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .node-role {
        fill: #aaaacc;
        font-family: 'Segoe UI', sans-serif;
        font-size: 10px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .link {
        stroke-width: 3;
        fill: none;
      }

      .port-label {
        fill: #888;
        font-family: monospace;
        font-size: 8px;
        text-anchor: middle;
      }
    </style>
    <!-- Router icon simplified -->
    <symbol id="router-icon" viewBox="0 0 40 40">
      <rect x="8" y="12" width="24" height="16" fill="none" stroke="currentColor" stroke-width="1.5" rx="2" />
      <line x1="20" y1="8" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" />
      <line x1="14" y1="8" x2="26" y2="8" stroke="currentColor" stroke-width="1.5" />
      <circle cx="14" cy="20" r="2" fill="currentColor" />
      <circle cx="20" cy="20" r="2" fill="currentColor" />
      <circle cx="26" cy="20" r="2" fill="currentColor" />
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#181B1F" />

  <!-- ═══════════════════ LINKS ═══════════════════ -->
  <!-- Link IDs follow pattern: link_id:{source}:{interface}:{dest}:{interface} -->

  <!-- xrd-1 ↔ xrd-3: Gi0/0/0/0 ↔ Gi0/0/0/2 -->
  <line id="link_xrd1_gi0_xrd3_gi2" class="link" x1="200" y1="300" x2="280" y2="180" stroke="#4BDD33" />
  <!-- xrd-1 ↔ xrd-5: Gi0/0/0/1 ↔ Gi0/0/0/2 -->
  <line id="link_xrd1_gi1_xrd5_gi2" class="link" x1="200" y1="300" x2="280" y2="420" stroke="#4BDD33" />

  <!-- xrd-2 ↔ xrd-4: Gi0/0/0/0 ↔ Gi0/0/0/2 -->
  <line id="link_xrd2_gi0_xrd4_gi2" class="link" x1="600" y1="300" x2="520" y2="180" stroke="#4BDD33" />
  <!-- xrd-2 ↔ xrd-6: Gi0/0/0/1 ↔ Gi0/0/0/2 -->
  <line id="link_xrd2_gi1_xrd6_gi2" class="link" x1="600" y1="300" x2="520" y2="420" stroke="#4BDD33" />

  <!-- xrd-3 ↔ xrd-4: Gi0/0/0/0 ↔ Gi0/0/0/0 -->
  <line id="link_xrd3_gi0_xrd4_gi0" class="link" x1="310" y1="160" x2="490" y2="160" stroke="#4BDD33" />
  <!-- xrd-3 ↔ xrd-5: Gi0/0/0/1 ↔ Gi0/0/0/1 -->
  <line id="link_xrd3_gi1_xrd5_gi1" class="link" x1="280" y1="200" x2="280" y2="400" stroke="#4BDD33" />
  <!-- xrd-3 ↔ xrd-7: Gi0/0/0/3 ↔ Gi0/0/0/0 -->
  <line id="link_xrd3_gi3_xrd7_gi0" class="link" x1="310" y1="140" x2="370" y2="70" stroke="#4BDD33" />

  <!-- xrd-4 ↔ xrd-6: Gi0/0/0/1 ↔ Gi0/0/0/1 -->
  <line id="link_xrd4_gi1_xrd6_gi1" class="link" x1="520" y1="200" x2="520" y2="400" stroke="#4BDD33" />
  <!-- xrd-4 ↔ xrd-7: Gi0/0/0/3 ↔ Gi0/0/0/1 -->
  <line id="link_xrd4_gi3_xrd7_gi1" class="link" x1="490" y1="140" x2="430" y2="70" stroke="#4BDD33" />

  <!-- xrd-5 ↔ xrd-6: Gi0/0/0/0 ↔ Gi0/0/0/0 -->
  <line id="link_xrd5_gi0_xrd6_gi0" class="link" x1="310" y1="440" x2="490" y2="440" stroke="#4BDD33" />
  <!-- xrd-5 ↔ xrd-8: Gi0/0/0/3 ↔ Gi0/0/0/0 -->
  <line id="link_xrd5_gi3_xrd8_gi0" class="link" x1="310" y1="460" x2="370" y2="530" stroke="#4BDD33" />

  <!-- xrd-6 ↔ xrd-8: Gi0/0/0/3 ↔ Gi0/0/0/1 -->
  <line id="link_xrd6_gi3_xrd8_gi1" class="link" x1="490" y1="460" x2="430" y2="530" stroke="#4BDD33" />

  <!-- ═══════════════════ NODES ═══════════════════ -->

  <!-- xrd-7 (PCE) - top center -->
  <rect id="node_xrd7" class="node-box" x="360" y="35" width="80" height="50" />
  <use href="#router-icon" x="380" y="38" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="400" y="60">xrd-7</text>
  <text class="node-role" x="400" y="78">PCE</text>

  <!-- xrd-3 - upper left -->
  <rect id="node_xrd3" class="node-box" x="240" y="135" width="80" height="50" />
  <use href="#router-icon" x="260" y="138" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="280" y="160">xrd-3</text>

  <!-- xrd-4 - upper right -->
  <rect id="node_xrd4" class="node-box" x="460" y="135" width="80" height="50" />
  <use href="#router-icon" x="480" y="138" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="500" y="160">xrd-4</text>

  <!-- xrd-1 - middle left (src) -->
  <rect id="node_xrd1" class="node-box" x="140" y="275" width="80" height="50" />
  <use href="#router-icon" x="160" y="278" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="180" y="300">xrd-1</text>
  <text class="node-role" x="180" y="318">src</text>

  <!-- xrd-2 - middle right (dst) -->
  <rect id="node_xrd2" class="node-box" x="560" y="275" width="80" height="50" />
  <use href="#router-icon" x="580" y="278" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="620" y="300">xrd-2</text>
  <text class="node-role" x="620" y="318">dst</text>

  <!-- xrd-5 - lower left -->
  <rect id="node_xrd5" class="node-box" x="240" y="405" width="80" height="50" />
  <use href="#router-icon" x="260" y="408" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="280" y="430">xrd-5</text>

  <!-- xrd-6 - lower right -->
  <rect id="node_xrd6" class="node-box" x="460" y="405" width="80" height="50" />
  <use href="#router-icon" x="480" y="408" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="500" y="430">xrd-6</text>

  <!-- xrd-8 (vRR) - bottom center -->
  <rect id="node_xrd8" class="node-box" x="360" y="515" width="80" height="50" />
  <use href="#router-icon" x="380" y="518" width="40" height="40" color="#4BDD33" />
  <text class="node-label" x="400" y="540">xrd-8</text>
  <text class="node-role" x="400" y="558">vRR</text>

  <!-- ═══════════════════ LEGEND ═══════════════════ -->
  <rect x="20" y="20" width="120" height="70" fill="#1a1a2e" stroke="#4a4a6a" rx="4" />
  <circle cx="40" cy="40" r="6" fill="#4BDD33" />
  <text x="55" y="44" fill="#ccc" font-size="11" font-family="sans-serif">Link UP</text>
  <circle cx="40" cy="60" r="6" fill="#FF3154" />
  <text x="55" y="64" fill="#ccc" font-size="11" font-family="sans-serif">Link DOWN</text>
  <circle cx="40" cy="80" r="6" fill="#808080" />
  <text x="55" y="84" fill="#ccc" font-size="11" font-family="sans-serif">No data</text>
</svg>